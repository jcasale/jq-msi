name: build

on:
  schedule:
    - cron: "42 6 * * *"

  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      tag: ${{ steps.result.outputs.tag }}

    steps:
      - name: Get upstream tag
        id: upstream-tag
        run: |
          result=$(gh release list --repo jqlang/jq --limit 1 --exclude-drafts --json tagName --jq '.[] |.tagName')

          if [ $? -ne 0 ]
          then
            exit $?
          fi

          echo $result

          echo "tag=$result" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get downstream tag
        id: downstream-tag
        run: |
          result=$(gh release list --repo ${{ github.repository_owner }}/${{ github.event.repository.name }} --limit 1 --exclude-drafts --json tagName --jq '.[] |.tagName')

          if [ $? -ne 0 ]
          then
            exit $?
          fi

          echo $result

          echo "tag=$result" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Result
        id: result
        shell: pwsh
        run: |
          $upstreamVersion = [Version]::new('${{ steps.upstream-tag.outputs.tag }}'.TrimStart('jq-'))

          if ('${{ steps.downstream-tag.outputs.tag }}')
          {
            $downstreamVersion = [Version]::new('${{ steps.downstream-tag.outputs.tag }}'.TrimStart('jq-'))
          }
          else
          {
            $downstreamVersion = [Version]::new()
          }

          if ($upstreamVersion -gt $downstreamVersion)
          {
            echo 'Build required.'
            "tag=${{ steps.upstream-tag.outputs.tag }}" >> $env:GITHUB_OUTPUT
          }
          else
          {
            echo 'Build not required.'
          }

  build:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 10
    needs: check
    if: needs.check.outputs.tag != ''

    steps:
      - uses: actions/checkout@v6

      - name: Set version
        id: version
        run: |
          $tag = "${{ needs.check.outputs.tag }}".TrimStart('jq-')
          $version = [version]::new($tag)
          if ($version.Build -lt 0)
          {
            $version = [version]::new($version.Major, $version.Minor, 0)
          }

          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "versionMajor=$($version.Major)" >> $env:GITHUB_OUTPUT
          echo "versionMinor=$($version.Minor)" >> $env:GITHUB_OUTPUT
          echo "versionBuild=$($version.Build)" >> $env:GITHUB_OUTPUT

      - name: Setup wix
        run: |
          dotnet.exe tool install --global wix --version 6.0.2 --verbosity diag

          wix.exe extension add WixToolset.UI.wixext/6.0.2 --global
          wix.exe extension add WixToolset.Util.wixext/6.0.2 --global
          wix.exe extension list --global

      - name: Download jq
        run: |
          gh.exe release download ${{ needs.check.outputs.tag }} --repo jqlang/jq --pattern jq-win64.exe
          Get-ChildItem
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename jq
        id: rename
        run: |
          $path = Move-Item ./jq-win64.exe ./jq.exe -PassThru -ErrorAction Stop
          echo "path=$path" >> $env:GITHUB_OUTPUT

      - name: Build installer
        run: |
          wix.exe `
            build `
            -arch x64 `
            -src src\Product.wxs `
            -d ProductSource="${{ steps.rename.outputs.path }}" `
            -d ProductVersion="${{ steps.version.outputs.version }}" `
            -ext WixToolset.UI.wixext `
            -out jq.msi

      - name: Validate installer
        run: wix.exe msi validate jq.msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: jq-msi
          path: ./jq.msi
          if-no-files-found: error

      - name: Test installer
        run: |
          $process = Start-Process msiexec.exe -ArgumentList '/i','jq.msi','/qn' -Wait -NoNewWindow -PassThru -ErrorAction Stop
          if ($process.ExitCode -ne 0)
          {
              throw 'Non zero exit code: "{0}".' -f $process.ExitCode
          }

          $path = Join-Path $env:ProgramFiles 'jqlang\jq.exe'
          & $path --version

      - name: Publish release
        run: gh.exe release create ${{ needs.check.outputs.tag }} --notes 'jq Windows build packaged as an msi.' jq.msi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
