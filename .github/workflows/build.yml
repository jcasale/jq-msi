name: build

on:
  schedule:
    - cron: "42 6 * * *"

  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      tag: ${{ steps.remote-tag.outputs.value }}
      publish: ${{ steps.publish.outputs.value }}

    steps:
      - name: Get remote tag
        id: remote-tag
        run: |
          tag=$(gh release list --repo jqlang/jq --limit 1 --exclude-drafts --json tagName --jq '.[] |.tagName')

          if [ $? -ne 0 ]
          then
            exit $?
          fi

          echo "value=$tag" |tee -a "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get local tag
        id: local-tag
        run: |
          tag=$(gh release list --repo ${{ github.repository_owner }}/${{ github.event.repository.name }} --limit 1 --exclude-drafts --json tagName --jq '.[] |.tagName')

          if [ $? -ne 0 ]
          then
            exit $?
          fi

          echo "value=$tag" |tee -a "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set publish condition
        id: publish
        shell: pwsh
        run: |
          $remoteVersion = [Version]::new('${{ steps.remote-tag.outputs.value }}'.TrimStart('jq-'))

          if ('${{ steps.local-tag.outputs.value }}')
          {
            $localVersion = [Version]::new('${{ steps.local-tag.outputs.value }}'.TrimStart('jq-'))
          }
          else
          {
            $localVersion = [Version]::new()
          }

          $required = $remoteVersion -gt $localVersion
          'value={0}' -f $required |Tee-Object -FilePath $env:GITHUB_OUTPUT -Append

  build:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 5
    needs: check

    steps:
      - uses: actions/checkout@v6

      - name: Set version
        id: version
        run: |
          $tag = '${{ needs.check.outputs.tag }}'.TrimStart('jq-')
          $version = [version]::new($tag)
          'version={0}' -f $version |Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
          'major={0}' -f $version.Major |Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
          'minor={0}' -f $version.Minor |Tee-Object -FilePath $env:GITHUB_OUTPUT -Append
          'build={0}' -f $version.Build |Tee-Object -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup wix
        run: |
          dotnet.exe tool install --global wix --version 6.0.2
          wix.exe extension add WixToolset.UI.wixext/6.0.2 --global

      - name: Download jq
        run: |
          gh.exe release download ${{ needs.check.outputs.tag }} --repo jqlang/jq --pattern jq-win64.exe
          Get-ChildItem
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename jq
        id: rename
        run: |
          $path = Move-Item ./jq-win64.exe ./jq.exe -PassThru -ErrorAction Stop
          'path={0}' -f $path |Tee-Object -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer
        run: |
          wix.exe `
            build `
            -arch x64 `
            -src src\Product.wxs `
            -d ProductSource="${{ steps.rename.outputs.path }}" `
            -d ProductVersion="${{ steps.version.outputs.version }}" `
            -ext WixToolset.UI.wixext `
            -out jq.msi

      - name: Validate installer
        run: wix.exe msi validate jq.msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ./jq.msi
          if-no-files-found: error

      - name: Test installer
        run: |
          $process = Start-Process msiexec.exe -ArgumentList '/i','jq.msi','/qn' -Wait -NoNewWindow -PassThru -ErrorAction Stop
          if ($process.ExitCode -ne 0)
          {
              throw 'Non zero exit code: "{0}".' -f $process.ExitCode
          }

          $path = Join-Path $env:ProgramFiles 'jqlang\jq.exe'
          & $path --version

      - name: Publish release
        if: needs.check.outputs.publish == 'True'
        run: gh.exe release create ${{ needs.check.outputs.tag }} --title ${{ needs.check.outputs.tag }} --notes 'jq Windows build packaged as an msi.' jq.msi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
